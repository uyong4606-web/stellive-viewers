      - name: 실행
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TASK: ${{ inputs.task }}
        run: |
          if [ -z "$YT_API_KEY" ]; then
            echo "::error::YT_API_KEY 비밀값이 없습니다. Settings → Secrets and variables → Actions 에서 추가하세요."; exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ]; then task="$INPUT_TASK"
          elif [ "$SCHEDULE" = '10 0 * * *' ]; then task=report
          else task=run; fi
          case "$task" in run|report|check|quota) ;; *) echo "::error::알 수 없는 task: $task"; exit 1;; esac
          cd youtube
          python3 ytdb.py load
          python3 youtube_tracker.py "$task"
          if [ "$task" = report ]; then python3 md2html.py "reports/youtube/$(date +%F).md"; fi
          python3 ytdb.py dump

      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in youtube/store youtube/reports youtube/data/yt_channel_daily.csv youtube/data/yt_videos.csv; do if [ -e "$p" ]; then git add "$p"; fi; done
          git diff --cached --quiet && exit 0
          git commit -q -m "youtube $(date '+%F %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
